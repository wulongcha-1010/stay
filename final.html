<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="card hidden" id="card">
  <h1 class="title">Happy Birthday</h1>
  <div class="photo-frame">
    <img id="photo" src="7.jpg" alt="照片 7">
    <p class="tap-hint">请持续点击</p>
  </div>
  <p class="wish">
    生日快乐！刘注<br>
    祝你：天天开心，长生不老，排泄通畅，永不得病
  </p>
  <p class="hint hidden" id="musicTip"></p>
</main>

<!-- 4 张表情包：散落在页面背景的四个方向 -->
<div class="emoji-scatter hidden" id="scatter">
  <img src="p.jpg" alt="p">
  <img src="q.jpg" alt="q">
  <img src="r.jpg" alt="r">
  <img src="s.jpg" alt="s">
</div>

<script>
  var PAGE = {
    alertText: '关音菩萨提醒您：前方注意音量',
    image: '7.jpg',
    final: true
  };
</script>
<script src="script.js"></script>

</body>
</html>
